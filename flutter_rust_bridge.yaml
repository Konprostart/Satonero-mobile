# flutter_rust_bridge codegen config for the Cashu wallet bridge.
#
# Regenerate the glue after changing `rust/src/escrow.rs` (or any public API):
#
#   flutter_rust_bridge_codegen generate
#
# The codegen binary and the Rust/Dart `flutter_rust_bridge` dependencies are
# pinned to 2.12.0 (the last release supporting the pinned Dart 3.8 SDK).
#
# License note: the generated Dart/Rust glue is MIT (flutter_rust_bridge is
# MIT); the Cashu crypto it wraps comes from the CDK (MIT OR Apache-2.0).

rust_input: crate::escrow
rust_root: rust/
dart_output: lib/features/cashu/wallet/bridge/
