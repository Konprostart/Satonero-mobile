# flutter_rust_bridge codegen config for the Cashu wallet bridge.
#
# The bridge is NOT generated yet (prep phase): the Dart `CashuWalletApi`
# abstraction in lib/features/cashu/wallet/cashu_wallet_api.dart is what the app
# codes against, and a future `CashuWalletFfi` will call the generated
# functions below. Run once the Rust crate is wired:
#
#   flutter_rust_bridge_codegen generate
