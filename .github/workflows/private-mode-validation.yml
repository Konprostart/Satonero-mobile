name: Private Mode Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: stable
          cache: true

      - name: Disable analytics
        run: flutter config --no-analytics

      - name: Install dependencies
        run: flutter pub get

      - name: Generate required files
        run: dart run build_runner build -d

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Run Private Mode tests
        run: flutter test test/services/private_mode_proxy_test.dart test/features/settings/private_mode_guard_test.dart

      - name: Build debug APK
        env:
          ALLOW_DEBUG_SIGNING: "true"
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: satonero-private-mode-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
