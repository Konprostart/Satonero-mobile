name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # Only match semver tags (v1.2.3), NOT v1.2.3+456
  # Verification build only: every publishing step is gated to tag refs.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-release:
    name: Build Android & Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Extract version from tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            FULL_TAG=${GITHUB_REF#refs/tags/}
            TAG=$(echo "${FULL_TAG#v}" | cut -d'+' -f1)
          else
            # workflow_dispatch: verification build, never published
            TAG="0.0.0-verify"
            FULL_TAG="v${TAG}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "full_tag=$FULL_TAG" >> $GITHUB_OUTPUT

          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            echo "prev_tag=" >> $GITHUB_OUTPUT
            echo "is_first=true" >> $GITHUB_OUTPUT
          else
            echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
            echo "is_first=false" >> $GITHUB_OUTPUT
          fi

          echo "Parsed: tag=$TAG full_tag=$FULL_TAG prev_tag=$PREV_TAG"

      - name: Generate changelog and release notes
        id: changelog
        run: |
          TAG=${{ steps.version.outputs.full_tag }}
          PREV_TAG=${{ steps.version.outputs.prev_tag }}
          IS_FIRST=${{ steps.version.outputs.is_first }}

          if [ "$IS_FIRST" = "true" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges "${PREV_TAG}..${TAG}")
          fi

          FEATURES=$(echo "$COMMITS" | grep -iE "^- (feat|add|new)" || true)
          FIXES=$(echo "$COMMITS" | grep -iE "^- (fix|bug|patch|hotfix)" || true)
          DOCS=$(echo "$COMMITS" | grep -iE "^- (doc|docs|readme)" || true)
          OTHER=$(echo "$COMMITS" | grep -ivE "^- (feat|add|new|fix|bug|patch|hotfix|doc|docs|readme|chore: update version|chore: update changelog)" || true)

          {
            echo "## What's New in $TAG"
            echo ""
            if [ -n "$FEATURES" ]; then echo "### ✨ New Features"; echo "$FEATURES"; echo ""; fi
            if [ -n "$FIXES" ]; then echo "### 🐛 Bug Fixes"; echo "$FIXES"; echo ""; fi
            if [ -n "$DOCS" ]; then echo "### 📚 Documentation"; echo "$DOCS"; echo ""; fi
            if [ -n "$OTHER" ]; then echo "### 🔧 Other Changes"; echo "$OTHER"; echo ""; fi
            if [ "$IS_FIRST" != "true" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
            fi
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Generate release description
        run: |
          TAG=${{ steps.version.outputs.full_tag }}
          FEATURES=$(sed -n '/### ✨/,/^###\|^$/p' RELEASE_NOTES.md | grep "^-" || true)
          FIXES=$(sed -n '/### 🐛/,/^###\|^$/p' RELEASE_NOTES.md | grep "^-" || true)

          {
            echo "# ⚡ Satonero ${TAG}"
            echo ""
            echo "A new version of the Satonero client for the Mostro P2P Bitcoin protocol is here!"
            echo ""
            if [ -n "$FEATURES" ]; then
              FEATURE_COUNT=$(echo "$FEATURES" | wc -l)
              echo "This release brings **${FEATURE_COUNT} new feature(s)**:"
              echo ""; echo "$FEATURES"; echo ""
            fi
            if [ -n "$FIXES" ]; then
              FIX_COUNT=$(echo "$FIXES" | wc -l)
              echo "We also squashed **${FIX_COUNT} bug(s)** 🐛:"
              echo ""; echo "$FIXES"; echo ""
            fi
            echo "---"; echo ""
            echo "### 📥 Install"
            echo "Download the APK for your device architecture below:"
            echo "- \`satonero-${TAG}-arm64-v8a.apk\` — most modern Android phones (64-bit)"
            echo "- \`satonero-${TAG}-armeabi-v7a.apk\` — older Android phones (32-bit)"
            echo ""
            echo "> The \`.aab\` (Android App Bundle) is for Google Play Store distribution."
            echo ""
            echo "### 🖥️ Desktop"
            echo "Linux and macOS builds are triggered separately and will be attached to this release shortly."
            echo ""
            echo "### 📋 Full Changelog"
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the complete history."
          } > RELEASE_BODY.md

          cat RELEASE_BODY.md

      - name: Verify signing secrets
        env:
          ANDROID_KEYSTORE_FILE_B64: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          missing=""
          [ -z "$ANDROID_KEYSTORE_FILE_B64" ] && missing="$missing ANDROID_KEYSTORE_FILE"
          [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$ANDROID_KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          [ -z "$ANDROID_KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$EXPECTED_CERT_SHA256" ] && missing="$missing vars.ANDROID_RELEASE_CERT_SHA256"
          if [ -n "$missing" ]; then echo "::error::Missing signing configuration:$missing"; exit 1; fi
          if ! printf '%s' "$EXPECTED_CERT_SHA256" | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "::error::ANDROID_RELEASE_CERT_SHA256 must be 64 hex characters"; exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: stable
          cache: true

      - name: Configure Flutter minSdkVersion
        run: |
          set -euo pipefail
          mkdir -p android
          touch android/local.properties
          if grep -qE '^flutter\.minSdkVersion=' android/local.properties; then
            sed -i 's/^flutter\.minSdkVersion=.*/flutter.minSdkVersion=23/' android/local.properties
          else
            echo "flutter.minSdkVersion=23" >> android/local.properties
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization and other required files
        run: dart run build_runner build -d

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Load release keystore
        env:
          ANDROID_KEYSTORE_FILE_B64: ${{ secrets.ANDROID_KEYSTORE_FILE }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_FILE_B64" | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks

      - name: Update version in pubspec for build
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          BUILD=$(git rev-list --count HEAD)
          sed -i "s/^version: .*/version: ${VERSION}+${BUILD}/" pubspec.yaml
          echo "Building with version: ${VERSION}+${BUILD}"

      - name: Build APK (split per ABI)
        run: flutter build apk --split-per-abi --dart-define=APP_VERSION=${{ steps.version.outputs.tag }} --dart-define=GIT_COMMIT=${{ github.sha }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_FILE: upload-keystore.jks

      - name: Build appBundle
        run: flutter build appbundle --release --dart-define=APP_VERSION=${{ steps.version.outputs.tag }} --dart-define=GIT_COMMIT=${{ github.sha }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_FILE: upload-keystore.jks

      - name: Rename split APKs
        run: |
          set -euo pipefail
          VERSION=${{ steps.version.outputs.full_tag }}
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             build/app/outputs/flutter-apk/satonero-${VERSION}-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/satonero-${VERSION}-arm64-v8a.apk
          ls -lh build/app/outputs/flutter-apk/satonero-${VERSION}-*.apk

      - name: Verify APK signing
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          VERSION=${{ steps.version.outputs.full_tag }}
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=$(find "$SDK_ROOT"/build-tools -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          AAPT=$(find "$SDK_ROOT"/build-tools -name aapt -type f 2>/dev/null | sort -V | tail -1)
          # apksigner is mandatory: fail closed if it cannot be found
          echo "apksigner=${APKSIGNER:-<none>} aapt=${AAPT:-<none>}"
          if [ ! -x "${APKSIGNER:-}" ] || [ ! -x "${AAPT:-}" ]; then
            echo "::error::apksigner/aapt not found under $SDK_ROOT/build-tools"; exit 1
          fi
          EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr 'A-F' 'a-f')
          test -n "$EXPECTED"
          for ARCH in armeabi-v7a arm64-v8a; do
            APK="build/app/outputs/flutter-apk/satonero-${VERSION}-${ARCH}.apk"
            test -f "$APK"
            if ! "$APKSIGNER" verify --print-certs "$APK" > /tmp/apk_signing.txt 2>&1; then
              echo "::error::apksigner verification failed ($ARCH)"; cat /tmp/apk_signing.txt; exit 1
            fi
            # Public certificate data only (no key material): safe to log.
            echo "--- apksigner output ($ARCH) ---"; cat /tmp/apk_signing.txt
            if grep -qi 'Android Debug' /tmp/apk_signing.txt; then
              echo "::error::debug-signed APK rejected ($ARCH)"; exit 1
            fi
            SIGNERS=$(grep 'certificate SHA-256 digest' /tmp/apk_signing.txt | sed -E 's/.*digest: *//' | tr -d ' \r' | tr 'A-F' 'a-f' || true)
            if [ "$(printf '%s\n' "$SIGNERS" | sed '/^$/d' | wc -l)" -ne 1 ]; then
              echo "::error::expected exactly one signer ($ARCH)"; exit 1
            fi
            if [ "$SIGNERS" != "$EXPECTED" ]; then
              echo "::error::certificate SHA-256 mismatch ($ARCH)"; exit 1
            fi
            "$AAPT" dump badging "$APK" | grep -q "package: name='com.konprostart.satonero'" \
              || { echo "::error::wrong package ($ARCH)"; exit 1; }
            echo "verified $ARCH against expected certificate"
          done
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          jarsigner -verify "$AAB" > /dev/null
          AAB_FP=$(keytool -printcert -jarfile "$AAB" | grep 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$AAB_FP" != "$EXPECTED" ]; then echo "::error::AAB certificate mismatch"; exit 1; fi
          echo "verified AAB against expected certificate"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Releases
          path: |
            build/app/outputs/flutter-apk/satonero-${{ steps.version.outputs.full_tag }}-armeabi-v7a.apk
            build/app/outputs/flutter-apk/satonero-${{ steps.version.outputs.full_tag }}-arm64-v8a.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          files: |
            build/app/outputs/flutter-apk/satonero-${{ steps.version.outputs.full_tag }}-armeabi-v7a.apk
            build/app/outputs/flutter-apk/satonero-${{ steps.version.outputs.full_tag }}-arm64-v8a.apk
            build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: false
          draft: false
          prerelease: false

      - name: Open changelog PR
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TAG=${{ steps.version.outputs.full_tag }}
          VERSION=${{ steps.version.outputs.tag }}
          BRANCH="chore/changelog-${TAG}"
          DATESTAMP=$(date -u +"%Y-%m-%d")

          # Idempotency: skip if branch already exists on remote
          git fetch origin
          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" > /dev/null 2>&1; then
            echo "Branch ${BRANCH} already exists — checking for open PR..."
            EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -n "$EXISTING_PR" ]; then
              echo "PR #${EXISTING_PR} already open for ${BRANCH} — skipping."
            else
              echo "Branch exists but no open PR — skipping to avoid duplicate push."
            fi
            exit 0
          fi

          git checkout -b "$BRANCH"

          BUILD=$(git rev-list --count HEAD)
          sed -i "s/^version: .*/version: ${VERSION}+${BUILD}/" pubspec.yaml

          FEATURES=$(sed -n '/### ✨/,/^###\|^$/p' RELEASE_NOTES.md | grep "^-" || true)
          FIXES=$(sed -n '/### 🐛/,/^###\|^$/p' RELEASE_NOTES.md | grep "^-" || true)
          DOCS=$(sed -n '/### 📚/,/^###\|^$/p' RELEASE_NOTES.md | grep "^-" || true)
          OTHER=$(sed -n '/### 🔧/,/^###\|^$/p' RELEASE_NOTES.md | grep "^-" || true)

          {
            echo "# Changelog"
            echo ""
            echo "All notable changes to this project will be documented in this file."
            echo ""
            echo "The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),"
            echo "and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html)."
            echo ""
            echo "## [${TAG}] - ${DATESTAMP}"
            echo ""
            if [ -n "$FEATURES" ]; then echo "### Added"; echo "$FEATURES"; echo ""; fi
            if [ -n "$FIXES" ]; then echo "### Fixed"; echo "$FIXES"; echo ""; fi
            if [ -n "$DOCS" ]; then echo "### Documentation"; echo "$DOCS"; echo ""; fi
            if [ -n "$OTHER" ]; then echo "### Changed"; echo "$OTHER"; echo ""; fi
            if [ -f CHANGELOG.md ]; then tail -n +7 CHANGELOG.md; fi
          } > CHANGELOG_NEW.md

          mv CHANGELOG_NEW.md CHANGELOG.md

          git add pubspec.yaml CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit — skipping PR creation."
            exit 0
          fi

          git commit -m "chore: update changelog and version for ${TAG}"
          git push origin "$BRANCH"

          # Write PR body to file to avoid YAML indentation issues with --body
          printf 'Automated changelog and version bump for `%s`.\n\n- Updates `CHANGELOG.md` with commits since the previous tag\n- Bumps `version:` in `pubspec.yaml` to `%s+%s`\n\n**Merge this after the release is published.**\n' \
            "$TAG" "$VERSION" "$BUILD" > PR_BODY.md

          gh pr create \
            --title "chore: update changelog and version for ${TAG}" \
            --body-file PR_BODY.md \
            --base main \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger desktop builds
        if: startsWith(github.ref, 'refs/tags/')
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: build-desktop
          client-payload: '{"version": "${{ steps.version.outputs.tag }}"}'

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
