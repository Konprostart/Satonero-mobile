repository: https://github.com/Konprostart/Satonero-mobile
description: |
  Satonero is a Satonero-branded client for the Mostro peer-to-peer Bitcoin
  trading protocol. It preserves compatibility with Mostro daemons and Nostr
  relays while removing Mostro-owned Firebase, push-server, and bootstrap relay
  defaults.

  Satonero does not operate a Mostro daemon, relay, push server, or Firebase
  project. Users connect to third-party Mostro daemons and public Nostr relays.
  Push notifications are disabled unless a Satonero-owned or self-hosted push
  server and Firebase project are supplied at build time.
summary: Satonero client for the Mostro peer-to-peer Bitcoin protocol on Nostr.
