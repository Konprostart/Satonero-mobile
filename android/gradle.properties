# Suppress obsolete Java version warnings
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The app is pure AndroidX; Jetifier is unnecessary and its in-memory jar
# rewriting OOMs on the large Flutter native-lib jars during release builds.
android.enableJetifier=false
